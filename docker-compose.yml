name: auto_chess
services:
  postgres-primary:
    image: postgres:16-alpine
    container_name: ac-postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-replica:
    image: postgres:16-alpine
    container_name: ac-postgres-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    depends_on:
      postgres-primary:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        until pg_isready -h postgres-primary -p 5432 -U ${POSTGRES_USER}; do
          echo "[replica] Waiting for primary..."; sleep 2;
        done
        echo "[replica] Taking base backup from primary..."
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h postgres-primary \
                      -D /var/lib/postgresql/data \
                      -U replicator \
                      -P -Xs -R \
                      --checkpoint=fast
        chown -R postgres:postgres /var/lib/postgresql/data
        echo "[replica] Base backup complete. Starting replica..."
        exec docker-entrypoint.sh postgres
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ac-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ac-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nest-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ac-nest-1
    environment:
      NODE_ENV: production
      HOSTNAME: nest-1
      NEST_PORT: 3000
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nest-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ac-nest-2
    environment:
      NODE_ENV: production
      HOSTNAME: nest-2
      NEST_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nest-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ac-nest-3
    environment:
      NODE_ENV: production
      HOSTNAME: nest-3
      NEST_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ac-nginx
    depends_on:
      - nest-1
      - nest-2
      - nest-3
    ports:
      - "80:80"
    volumes:
      # Mount config so changes apply on `docker compose restart nginx`
      # without rebuilding the image. (Image still bakes a default config
      # via COPY; this bind-mount overrides it at runtime.)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pg_primary_data:
  pg_replica_data:
  pgadmin_data:

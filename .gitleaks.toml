[extend]
useDefault = true

[allowlist]
description = "Known non-secret placeholder values, verified false positives"
regexes = [
  # old .github/workflows/backend-ci.yml (removed, still in git history) --
  # JWT_SECRET: ci_jwt_secret_not_a_real_secret_...,
  # a hardcoded CI-only placeholder, never a real credential. Two literal
  # variants exist across git history (an earlier draft used a different
  # placeholder string before this one).
  '''ci_jwt_secret_not_a_real_secret_0123456789abcdef''',
  '''test_secret_at_least_32_bytes_long_padding_xx''',
  # backend/src/ws/ws.smoke.ts (historical) -- a deliberately-named
  # `garbage` JWT with signature "invalid_signature_xxx...", used to test
  # that the server rejects a tampered/garbage token.
  '''invalid_signature_xxxxxxxxxxxxxxxxxxxxxxxxxx''',
  # ci/scripts/gate-proof.sh (added in ec4a3de, removed in 6011058, still in
  # git history): an invented key whose only purpose was to make Gitleaks go
  # red in a throwaway demo branch. Not a credential for anything.
  '''k3Gh29sLpQ7vXz81MnB4cD5eF6gH7iJ0uV2wX3yZ''',
]
paths = [
  '''infra/jenkins/plugins\.txt'''
]

name: mobile-ci

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # `flutter analyze` exits non-zero on any info/warning/error given
      # the strict analysis_options.yaml (P3-FE-02), so a clean tree is the gate.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # NOTE: `flutter build apk --debug` is intentionally not run yet — the
      # repo has no `mobile/android/` platform folder (package id, manifest,
      # signing, icons). Creating it is app-config work, not CI. Re-add this
      # step once that folder is committed:
      #   - uses: actions/setup-java@v4
      #     with: { distribution: temurin, java-version: '17' }
      #   - run: flutter build apk --debug

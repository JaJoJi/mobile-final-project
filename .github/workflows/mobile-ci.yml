name: mobile-ci

# Minimal: format check + analyze + test. No APK build (repo has no
# mobile/android/ yet).

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage

      # Floor, not a target: pinned just under the measured baseline as
      # of 2026-09-24 (86.21% lines) so a PR can't silently regress
      # coverage back toward zero (#274). No lcov/genhtml dependency —
      # flutter's own lcov.info already has the LF/LH totals we need.
      - name: Coverage threshold
        run: |
          LH=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' coverage/lcov.info)
          LF=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' coverage/lcov.info)
          PCT=$(awk "BEGIN{printf \"%.2f\", 100*${LH}/${LF}}")
          echo "Line coverage: ${PCT}% (${LH}/${LF})"
          awk "BEGIN{exit !(${PCT} >= 84)}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/
          if-no-files-found: warn

  # Quality gate (P4-DO): SonarQube static analysis + coverage.
  # Skips cleanly until SONAR_HOST_URL/SONAR_TOKEN repo secrets exist —
  # see docs on the self-hosted SonarQube setup.
  sonar:
    runs-on: ubuntu-latest
    needs: mobile
    # `secrets` isn't a valid context in ANY `if:` (job or step -- only
    # github/inputs/needs/vars at job level, plus env/job/steps/etc at
    # step level, per GitHub's context-availability table). Confirmed
    # with actionlint: using it in a job-level `if:` silently invalidates
    # the whole workflow file (every run fails with zero jobs, no useful
    # error on the PR checks list). Fix: read the secrets into job-level
    # `env:` (secrets ARE readable there) and gate each step on `env.*`,
    # which step-level `if:` is allowed to reference.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      - name: Coverage for Sonar
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: flutter test --coverage
      - name: SonarQube scan + quality gate
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: mobile
          args: -Dsonar.qualitygate.wait=true

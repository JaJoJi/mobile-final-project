name: mobile-ci

# Minimal: format check + analyze + test. No APK build (repo has no
# mobile/android/ yet).

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # Quality gate (P4-DO): SonarQube static analysis + coverage.
  # Skips cleanly until SONAR_HOST_URL/SONAR_TOKEN repo secrets exist —
  # see docs on the self-hosted SonarQube setup.
  sonar:
    runs-on: ubuntu-latest
    needs: mobile
    if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Coverage for Sonar
        run: flutter test --coverage
      - name: SonarQube scan + quality gate
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: mobile
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

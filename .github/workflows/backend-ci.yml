name: backend-ci

# Two jobs:
#   backend             — fast gate on every PR: typecheck + build + unit tests.
#                         No DB/Redis, no coverage gate. Unchanged from before.
#   backend-integration — the slow gate (P3-DO-08): real Postgres + Redis
#                         service containers + three real Nest instances
#                         (nest-1/2/3, as in docker-compose), migrations,
#                         the *.smoke.ts integration suite (matchmaking,
#                         round-orchestrator, shop, ws) and the `test:cov`
#                         coverage gate that used to run only locally.
#                         Coverage is uploaded as an artifact.

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint (typecheck)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  backend-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auto_chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Service containers are reachable on localhost from the job runner.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/auto_chess
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_jwt_secret_not_a_real_secret_0123456789abcdef
      JWT_ACCESS_TTL: 7d
      JWT_REFRESH_TTL: 30d
      NEST_PORT: '3000'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      # The round-orchestrator integration smoke enqueues a *real* BullMQ
      # PHASE_TIMER job and asserts that one of several running Nest
      # workers consumes it, wins the combat lock and persists exactly one
      # round — Postgres + Redis alone are not enough. Boot three Nest
      # instances (matching docker-compose's nest-1/2/3), sharing this
      # job's DB + Redis, on ports 3000/3001/3002. ws.smoke.ts then
      # targets nest-1 on :3000. Migrations already ran, so RUN_MIGRATIONS
      # stays false on all three.
      - name: Start 3 Nest instances (background)
        run: |
          mkdir -p nest-logs
          : > nest-logs/pids
          for n in 1 2 3; do
            port=$((2999 + n))
            HOSTNAME="nest-$n" NEST_PORT="$port" RUN_MIGRATIONS=false \
              node dist/main.js > "nest-logs/nest-$n.log" 2>&1 &
            echo $! >> nest-logs/pids
          done
          for n in 1 2 3; do
            port=$((2999 + n))
            ready=
            for i in $(seq 1 45); do
              if curl -sf "http://localhost:$port/health/ready" > /dev/null; then
                echo "nest-$n ready on :$port after ${i}s"; ready=1; break
              fi
              sleep 1
            done
            if [ -z "$ready" ]; then
              echo "nest-$n did not become ready in 45s"; cat "nest-logs/nest-$n.log"; exit 1
            fi
          done

      # ── Integration smoke suite ───────────────────────────────────────
      # Each script exits non-zero on a failed assertion, failing the step.
      - name: Smoke — matchmaking
        run: npm run smoke:matchmaking

      - name: Smoke — round-orchestrator (integration)
        run: npm run smoke:round-orchestrator:integration

      - name: Smoke — shop (integration)
        run: npm run smoke:shop:integration

      - name: Smoke — ws
        run: npm run smoke:ws
        env:
          HTTP_BASE: http://localhost:3000

      - name: Stop Nest instances
        if: always()
        run: |
          [ -f nest-logs/pids ] && xargs kill < nest-logs/pids 2>/dev/null || true
          for n in 1 2 3; do
            echo "--- nest-$n.log ---"; cat "nest-logs/nest-$n.log" 2>/dev/null || true
          done

      # ── Coverage gate ────────────────────────────────────────────────
      # Same jest config as local: the src/game >=90% line-coverage
      # threshold (NFR-9) fails this step in CI just like it does locally.
      - name: Coverage (test:cov)
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

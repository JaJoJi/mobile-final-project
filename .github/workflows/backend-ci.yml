name: backend-ci

# Deliberately minimal while the codebase is moving fast: typecheck +
# build + unit tests, nothing else. No DB/Redis services, no coverage
# gate in CI, no artifacts. `npm run test:cov` still runs the >=90%
# src/game gate locally.

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit (npm audit --audit-level=high)
        # P3-DO-07: fail the build on a known HIGH/CRITICAL advisory in the
        # backend dependency tree. Dependabot (#141) opens PRs to fix these;
        # this makes an unpatched one block merge instead of sitting open.
        run: npm audit --audit-level=high
      - name: Lint (typecheck)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

name: security

# DevSecOps quality gate (P4-DO): secret scanning + dependency (SCA)
# scanning, independent of the SonarQube SAST gate in backend-ci.yml /
# mobile-ci.yml. Blocking: a failed job here fails the check on the PR.

on:
  pull_request:
  push:
    branches: [dev, main]

# Least privilege by default (Checkov CKV2_GHA_1); jobs that need more
# (release.yml build-and-push) widen it at job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          # Pinned by version + digest (same as the Jenkinsfile); `git`
          # replaces the deprecated `detect` subcommand and scans full history.
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint gitleaks \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config=.gitleaks.toml --redact --exit-code 1 .

  backend-sca:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The pre-existing high/critical findings (lodash/js-yaml/multer/
      # tar, via @nestjs/swagger + @nestjs/platform-express + bcrypt's
      # node-pre-gyp) are cleared via the `overrides` pins in
      # package.json (see #220) -- verified for real: build, lint,
      # 126/126 tests, and bcrypt's native binary all still green.
      # #270 (the NestJS-major-bump plan) is superseded, closed.
      - name: npm audit (block on high)
        run: npm audit --audit-level=high

  mobile-sca:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned to match the Jenkins flutter image (ghcr.io/cirruslabs/flutter:3.44.0)
          # so both gates format/analyze/test on the exact same SDK.
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      # dart pub audit needs a recent Dart SDK; kept non-blocking until
      # it's confirmed stable on the pinned Flutter channel.
      - name: dart pub audit
        run: dart pub audit
        continue-on-error: true

name: release

# Builds + pushes the backend image to GHCR:
#   - every push to `main`             -> :latest + :main-<short-sha>
#   - every `vX.Y.Z` tag (release-please, see release-please.yml)
#                                       -> :vX.Y.Z + :X.Y
#
# amd64 only for now (MVP — see design notes on #137). No deploy step:
# there is no server to deploy to yet (tracked in #193); this workflow
# stops at "image is in GHCR", same as the issue's own design note says
# for MVP ("just build + push, manual deploy").
#
# Uses the workflow-scoped GITHUB_TOKEN (packages: write below) — no
# personal access token needed, unlike the setup steps originally
# sketched in #137 (that PAT step doesn't apply to this login method).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'backend/**'
      - '.github/workflows/release.yml'

# Least privilege by default (Checkov CKV2_GHA_1); jobs that need more
# (release.yml build-and-push) widen it at job level.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/jajoji/auto_chess-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{branch}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO (#191): Trivy scan on the built image before it's trusted,
      # once that issue lands — block on HIGH/CRITICAL rather than
      # scanning post-hoc.

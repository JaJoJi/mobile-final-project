name: release

# Builds, scans, then pushes the backend image to GHCR:
#   - every push to `main`             -> :latest + :main-<short-sha>
#   - every `vX.Y.Z` tag (release-please, see release-please.yml)
#                                       -> :vX.Y.Z + :X.Y
#
# amd64 only for now (MVP — see design notes on #137). No deploy step:
# there is no server to deploy to yet (tracked in #193); this workflow
# stops at "image is in GHCR".
#
# P3-DO-07 (#191): a Trivy image scan runs *between* build and push. Any
# HIGH/CRITICAL vulnerability with a fix available fails the job, so a
# vulnerable image never reaches GHCR. Accepted findings are listed in
# `.trivyignore` with a one-line reason each.
#
# Uses the workflow-scoped GITHUB_TOKEN (packages: write below) — no
# personal access token needed.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'backend/**'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jajoji/auto_chess-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{branch}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 1. Build only — load into the local docker daemon, do NOT push yet.
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          # Real registry tags + one fixed local tag Trivy can always
          # reference (the registry tag set varies: `latest` on main,
          # `vX.Y.Z` on a release tag).
          tags: |
            ${{ steps.meta.outputs.tags }}
            localbuild/auto_chess-backend:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Scan the freshly-built image. Fail on fixable HIGH/CRITICAL.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: localbuild/auto_chess-backend:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          # Pull the DB from GHCR's mirror to dodge the anonymous
          # ghcr.io/aquasecurity rate limit on public runners.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db

      # 3. Only now push. Re-invokes build-push-action; the layers are
      #    already in the gha cache so this is effectively just an upload.
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

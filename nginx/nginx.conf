worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    upstream backend {
        least_conn;
        server nest-1:3000 max_fails=3 fail_timeout=10s;
        server nest-2:3000 max_fails=3 fail_timeout=10s;
        server nest-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ─── CORS for browser clients (Flutter web, etc.) ───
        # MVP: allow any origin. Tighten before production.
        add_header 'Access-Control-Allow-Origin'  '*'                                   always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Max-Age'       86400                                 always;

        # Preflight short-circuit: respond 204 directly, do not proxy.
        # This avoids the CORS preflight hitting Nest at all.
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location = /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # WebSocket / socket.io namespace
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

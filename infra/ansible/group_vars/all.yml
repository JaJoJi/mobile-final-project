# Defaults for provision.yml + jenkins-host.yml. Per-person values
# (budget email, teammates' IPs) go in vars.yml -- copy vars.example.yml.

# Azure for Students policy only allows: japanwest, eastasia, malaysiawest,
# indonesiacentral, southeastasia. On 2026-09-28 southeastasia/japanwest had
# no capacity for 2-vCPU B/D sizes (SkuNotAvailable) and Standard_B2s (v1) is
# no longer offered -- malaysiawest was unrestricted and cheapest.
azure_location: malaysiawest            # Kuala Lumpur, close to Thailand
resource_group: mfp-jenkins-rg
vm_name: mfp-jenkins
# 2 vCPU / 4 GB (same spec as the originally planned B2s), $0.0428/h
# ~= $31/month 24/7 (no auto-shutdown, decided 2026-09-28), until ~2026-10-15.
vm_size: Standard_B2als_v2
vm_image: Canonical:ubuntu-24_04-lts:server:latest
os_disk_gb: 64                          # scanner images + docker cache + jenkins_home
admin_username: azureuser
ssh_public_key_file: /keys/id.pub       # mounted by run.sh from $SSH_KEY.pub

# Extra CIDRs allowed to SSH in, on top of the IPv4 of whoever runs
# provision.yml (auto-detected). Never 0.0.0.0/0 -- the repo is public.
admin_cidrs: []

# Jenkins is private (SSH tunnel only). Links in GitHub statuses / emails
# point here and open through `ssh -L 8080:127.0.0.1:8080 ...`.
jenkins_url: "http://localhost:8080/"

# 4 GB VM: one build at a time + swap as a safety net (a 2-build run froze
# the VM on 2026-09-28). Raise executors only after a bigger vm_size.
jenkins_executors: 1
swap_size: 4G

# Cost Management budget: EMAIL ALERT ONLY, it never stops the VM.
budget_amount: 30
budget_start_date: "2026-09-01"         # must be the 1st of a month
budget_end_date: "2026-12-31"
budget_alert_emails: []                 # required, set in vars.yml

azure_tags: "project=mobile-final-project purpose=jenkins-ci"

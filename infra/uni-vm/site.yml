# Configures the university VM (app + monitoring host, #222). Runs ON the
# VM against itself -- the VM sits behind the campus NAT, so nothing
# (Jenkins included) connects in; it only reaches out to GitHub and
# Docker Hub. Idempotent: re-run after every `git pull`.
#
#   sudo apt-get install -y ansible-core git
#   git clone https://github.com/JaJoJi/mobile-final-project.git && cd mobile-final-project
#   sudo ansible-playbook -i localhost, -c local infra/uni-vm/site.yml
#
# Then (README): fill /etc/auto-chess/app.env + /etc/psu-autologin.env,
# `docker login` with a read-only token, `sudo auto-chess-deploy <tag>`.
- name: Configure the university VM
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    repo_dir: "{{ playbook_dir | dirname | dirname }}"

  tasks:
    - name: Supported OS
      ansible.builtin.assert:
        that: ansible_facts.distribution in ['Ubuntu', 'Debian']
        fail_msg: "site.yml supports Ubuntu/Debian (found {{ ansible_facts.distribution }})"
        quiet: true

    # ── Keep the VM online (PSU captive portal) ─────────────────────────
    - name: PSU portal auto-login
      ansible.builtin.command: "{{ repo_dir }}/infra/uni-vm/psu-autologin/install.sh"
      args:
        creates: /usr/local/bin/psu-autologin

    # ── Docker Engine + compose plugin (upstream repo) ──────────────────
    # The university image may already ship Docker's repo (e.g. docker.list
    # with signed-by=/etc/apt/keyrings/docker.gpg). Adding a second entry
    # for the same source with a different key breaks apt entirely
    # ("Conflicting values set for option Signed-By"), so reuse theirs.
    - name: Existing Docker apt source?
      ansible.builtin.shell: >
        grep -rls 'download.docker.com' /etc/apt/sources.list /etc/apt/sources.list.d/
        | grep -v '/docker.sources$'
      register: existing_docker_repo
      changed_when: false
      failed_when: false

    # Plain file removal: runs before apt is usable again, and before
    # python3-debian (needed by deb822_repository) is guaranteed.
    - name: Drop our duplicate Docker source (another one exists)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent
      when: existing_docker_repo.stdout | length > 0

    - name: Base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        update_cache: true
        cache_valid_time: 3600

    - name: Docker apt repo
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
      when: existing_docker_repo.stdout | length == 0

    - name: Docker Engine
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: true

    - name: Docker running
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    # Container logs would otherwise grow without limit on the VM disk.
    - name: Docker log rotation
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "3"}}
      register: daemon_json

    - name: Restart docker for log settings
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      when: daemon_json is changed

    # ── App config + deploy command ─────────────────────────────────────
    - name: Secrets dir
      ansible.builtin.file:
        path: /etc/auto-chess
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: App env file (only if missing -- never overwrites secrets)
      ansible.builtin.copy:
        src: "{{ repo_dir }}/infra/uni-vm/app/app.env.example"
        dest: /etc/auto-chess/app.env
        owner: root
        group: root
        mode: "0600"
        force: false

    # Lets plain `docker compose -f infra/uni-vm/app/compose.yml up -d`
    # find the secrets: compose auto-loads .env next to the compose file.
    # Symlink, so the secrets stay root-only in /etc (and out of git).
    - name: compose .env -> /etc/auto-chess/app.env
      ansible.builtin.file:
        src: /etc/auto-chess/app.env
        dest: "{{ repo_dir }}/infra/uni-vm/app/.env"
        state: link
        force: true

    - name: Deploy state dir
      ansible.builtin.file:
        path: /var/lib/auto-chess
        state: directory
        mode: "0755"

    - name: auto-chess-deploy command
      ansible.builtin.file:
        src: "{{ repo_dir }}/infra/uni-vm/app/deploy.sh"
        dest: /usr/local/bin/auto-chess-deploy
        state: link
        force: true

    - name: deploy.sh is executable
      ansible.builtin.file:
        path: "{{ repo_dir }}/infra/uni-vm/app/deploy.sh"
        mode: "0755"

    # ── App HTTPS (#139) ────────────────────────────────────────────────
    # Self-signed cert so the 443 listener works out of the box (the VM is
    # behind the campus NAT, no public DNS name -> no Let's Encrypt). Put a
    # real cert/key at the same paths to replace it, then `up -d nginx`.
    # Readable by the image's nginx user (uid 101) only.
    - name: App TLS dir
      ansible.builtin.file:
        path: /etc/auto-chess/tls
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: App TLS key + certificate (once)
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 825
        -subj "/CN={{ ansible_facts.hostname }}"
        -addext "subjectAltName=DNS:{{ ansible_facts.hostname }},DNS:localhost,IP:127.0.0.1{{ (',IP:' ~ ansible_facts.default_ipv4.address) if ansible_facts.default_ipv4 is defined and ansible_facts.default_ipv4.address is defined else '' }}"
        -keyout /etc/auto-chess/tls/server.key
        -out /etc/auto-chess/tls/server.crt
      args:
        creates: /etc/auto-chess/tls/server.crt

    - name: App TLS key readable by the nginx user only
      ansible.builtin.file:
        path: /etc/auto-chess/tls/server.key
        owner: "101"
        group: "101"
        mode: "0600"

    - name: App TLS certificate is public
      ansible.builtin.file:
        path: /etc/auto-chess/tls/server.crt
        mode: "0644"

    # ── Vault (#223) ────────────────────────────────────────────────────
    # Self-signed TLS for Vault's listener (only compose services talk to
    # it, they pin this cert as their CA). The key stays readable only by
    # the container's `vault` user (uid 100).
    - name: Vault TLS dir
      ansible.builtin.file:
        path: /etc/auto-chess/vault-tls
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Vault TLS key + certificate (once)
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 3650
        -subj "/CN=vault"
        -addext "subjectAltName=DNS:vault,DNS:localhost,IP:127.0.0.1"
        -keyout /etc/auto-chess/vault-tls/vault.key
        -out /etc/auto-chess/vault-tls/vault.crt
      args:
        creates: /etc/auto-chess/vault-tls/vault.crt

    - name: Vault TLS key readable by the vault user only
      ansible.builtin.file:
        path: /etc/auto-chess/vault-tls/vault.key
        owner: "100"
        group: "1000"
        mode: "0600"

    - name: Vault TLS certificate is public
      ansible.builtin.file:
        path: /etc/auto-chess/vault-tls/vault.crt
        mode: "0644"

    - name: Vault credential dirs (filled by bootstrap.sh)
      ansible.builtin.file:
        path: "/etc/auto-chess/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: [vault-agent, vault-backup]

    - name: Vault scripts are executable
      ansible.builtin.file:
        path: "{{ repo_dir }}/infra/uni-vm/vault/{{ item }}"
        mode: "0755"
      loop: [bootstrap.sh, unseal.sh, backup.sh]

    - name: auto-chess-vault-unseal command
      ansible.builtin.file:
        src: "{{ repo_dir }}/infra/uni-vm/vault/unseal.sh"
        dest: /usr/local/bin/auto-chess-vault-unseal
        state: link
        force: true

    - name: Vault snapshot backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/auto-chess-vault-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Vault Raft snapshot (auto-chess)
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart={{ repo_dir }}/infra/uni-vm/vault/backup.sh

    - name: Vault snapshot backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/auto-chess-vault-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Vault Raft snapshot (auto-chess)

          [Timer]
          OnCalendar=*-*-* 03:30:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable Vault backup timer
      ansible.builtin.systemd_service:
        name: auto-chess-vault-backup.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Docker Hub login present?
      ansible.builtin.stat:
        path: /root/.docker/config.json
      register: docker_login

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "1. sudo nano /etc/psu-autologin.env        (PSU username/password)"
          - "{{ '2. done: docker login present' if docker_login.stat.exists else '2. sudo docker login -u fiatthanapon   (paste a READ-ONLY Docker Hub token)' }}"
          - "3. docker compose -f infra/uni-vm/app/compose.yml up -d vault"
          - "4. sudo infra/uni-vm/vault/bootstrap.sh    (once: init, unseal, secrets -> Vault; save the unseal keys)"
          - "5. sudo auto-chess-deploy <tag>            (tag = commit from the Jenkins main build)"
          - "After a VM reboot: sudo auto-chess-vault-unseal   (Vault starts sealed)"

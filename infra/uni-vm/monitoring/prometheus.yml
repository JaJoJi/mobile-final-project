# Prometheus on the university VM (#225). Metrics arrive two ways:
#   - scraped here: Beyla (RED metrics of nest-1/2/3 + nginx via eBPF,
#     no code changes), Alloy and Prometheus itself
#   - pushed by Alloy (remote_write): host CPU / memory / disk / network
#     (needs --web.enable-remote-write-receiver, set in compose)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: beyla
    static_configs:
      - targets: ["beyla:9400"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auto-chess-operations
    scrape_interval: 60s
    static_configs:
      - targets: ["nest-1:3000"]
    metrics_path: /metrics

rule_files:
  - /etc/prometheus/alerts.yml

# Tempo 2.x monolithic, local storage (#225). nest-1/2/3 send spans over
# OTLP/HTTP (backend/src/tracing.ts, OTEL_EXPORTER_OTLP_ENDPOINT).
# Pinned to 2.x on purpose: Tempo 3 drops the single-binary
# ingester/compactor setup in favour of a Kafka-based ingest path, which
# is out of scope for one VM.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h          # 3 days of traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false

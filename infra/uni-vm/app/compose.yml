# Production stack on the university VM (#221). Same topology as the dev
# docker-compose.yml (nginx -> nest x3 -> Redis + Postgres primary/replica)
# but nothing is built here: nest runs the image Jenkins released to
# Docker Hub after it passed every gate (pull-based deploy, see deploy.sh).
#
# Deploy (from the repo root):
#   docker compose -f infra/uni-vm/app/compose.yml pull
#   docker compose -f infra/uni-vm/app/compose.yml up -d
# Compose reads infra/uni-vm/app/.env automatically -- site.yml makes it a
# symlink to /etc/auto-chess/app.env (root-only secrets, gitignored).
# IMAGE_TAG there picks the release (default latest). deploy.sh does the
# same plus a health check and automatic rollback.
name: auto-chess

x-nest: &nest
  image: ${IMAGE_REPO:-fiatthanapon/mobile-final-project}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    postgres-primary:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &nest-env
    NODE_ENV: production
    NEST_PORT: 3000
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
    DATABASE_REPLICA_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-7d}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
    COMBAT_DONE_TIMEOUT_MS: ${COMBAT_DONE_TIMEOUT_MS:-60000}

services:
  postgres-primary:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10",
              "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ../../../postgres/init-primary.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    depends_on:
      postgres-primary:
        condition: service_healthy
    # Same bootstrap as the dev compose: base backup from the primary on
    # first start, then run as a hot standby.
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_isready -h postgres-primary -U "$$POSTGRES_USER"; do sleep 2; done
          pg_basebackup -h postgres-primary -D /var/lib/postgresql/data \
            -U replicator -P -Xs -R --checkpoint=fast
          chown -R postgres:postgres /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nest-1:
    <<: *nest
    environment:
      <<: *nest-env
      HOSTNAME: nest-1
      RUN_MIGRATIONS: "true"     # one instance migrates, the others don't race it
  nest-2:
    <<: *nest
    environment:
      <<: *nest-env
      HOSTNAME: nest-2
  nest-3:
    <<: *nest
    environment:
      <<: *nest-env
      HOSTNAME: nest-3

  # nginx + ModSecurity WAF with OWASP CRS (#224): the official image,
  # pinned LTS release + digest, configured by mounting our templates (no
  # build on the VM). Unprivileged: listens on 8080 inside, published on 80.
  # Starts in DetectionOnly: attacks are logged (JSON audit log on stdout,
  # `docker compose logs nginx`) but not blocked, until the logs show no
  # false positives; then set MODSEC_RULE_ENGINE=On in app.env + up -d.
  nginx:
    image: owasp/modsecurity-crs:4.25.1-nginx-alpine-202609301109-lts@sha256:486b90815ad28f584a84fcd308259d0c8962b5a67f770e63730ab654595f360a
    restart: unless-stopped
    depends_on: [nest-1, nest-2, nest-3]
    ports:
      - "80:8080"
    environment:
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-DetectionOnly}
      BLOCKING_PARANOIA: 1
      # Fixed, not `auto`: the VM is shared with nest x3, Postgres, monitoring.
      NGINX_WORKER_PROCESSES: 2
      SERVER_TOKENS: "off"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
    volumes:
      - ../../../nginx/modsec/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ../../../nginx/modsec/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
    # CRS workers can grow under load (#224): cap it so a runaway worker
    # gets the WAF restarted instead of starving the app.
    mem_limit: 512m
    # The image's own healthcheck probes https://:8443, which our server
    # block doesn't serve -- probe the plain-HTTP /healthz instead.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  pg_primary_data:
  pg_replica_data:

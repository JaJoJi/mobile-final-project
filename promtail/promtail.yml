# Promtail config — P3-DO-03 (#138), scaffolding.
#
# Ships every compose container's stdout/stderr to Loki, keyed by the
# compose service + container name. Works today with plain Nest `Logger`
# output; once the backend switches to pino JSON, add a `pipeline_stages`
# `json:` block here to promote fields (level, matchId, ...) to labels.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      # Only ship this project's containers.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "auto_chess"
        action: keep
